plugins { id 'com.android.application' }
android {
    namespace 'com.devinfo.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.devinfo.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('../keystore/devinfo.keystore')
            storePassword 'devinfo123'
            keyAlias 'devinfo'
            keyPassword 'devinfo123'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
