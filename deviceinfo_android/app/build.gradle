plugins { id 'com.android.application' }
android {
    namespace 'com.deviceinfo.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.deviceinfo.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.0.6'
    }
    signingConfigs {
        release {
            storeFile file('../keystore/deviceinfo.keystore')
            storePassword 'deviceinfo'
            keyAlias 'deviceinfo'
            keyPassword 'deviceinfo'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests { includeAndroidResources = true; all {
        maxHeapSize = "2g"
        def rd = new File('/home/user/rdeps')
        if (rd.exists()) { systemProperty 'robolectric.offline', 'true'; systemProperty 'robolectric.dependency.dir', rd.absolutePath }
    } } }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
